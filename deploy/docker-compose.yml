# Compose de produção (fonte única). O workflow envia este arquivo e deploy/nginx/ para
# ~/projetos/back-app247 no servidor, junto do .env de produção.
# Local: docker compose -f deploy/docker-compose.yml --env-file .env up -d
name: app247

services:
  app:
    image: jefiroo/app247-backend
    container_name: app247-api

    init: true
    restart: unless-stopped
    # Só local: a entrada pública é ngrok -> nginx. Acesso direto via túnel SSH.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: "${DB_URL}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT: "${JWT}"
      IDENTITY_HASH_SECRET: "${IDENTITY_HASH_SECRET:?IDENTITY_HASH_SECRET obrigatorio}"
      TENANT_LINK_INVITATION_TTL: "${TENANT_LINK_INVITATION_TTL:-PT72H}"
      TEST_ENDPOINTS_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: "${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MP_CLIENT_ID: "${MP_CLIENT_ID:-}"
      MP_CLIENT_SECRET: "${MP_CLIENT_SECRET:-}"
      MP_WEBHOOK_SECRET: "${MP_WEBHOOK_SECRET:-}"
      MP_OAUTH_REDIRECT_URL: "${MP_OAUTH_REDIRECT_URL:-}"
      MP_WEBHOOK_URL: "${MP_WEBHOOK_URL:-}"
      MP_TEST_ACCESS_TOKEN: "${MP_TEST_ACCESS_TOKEN:-}"
      MP_TEST_TERMINAL_ID: "${MP_TEST_TERMINAL_ID:-NEWLAND_N950__SBX0000001}"
      OCI_NAMESPACE: "${OCI_NAMESPACE:-}"
      OCI_REGION: "${OCI_REGION:-}"
      OCI_BUCKET: "${OCI_BUCKET:-app-imagens}"
      OCI_ACCESS_KEY: "${OCI_ACCESS_KEY:-}"
      OCI_SECRET_KEY: "${OCI_SECRET_KEY:-}"
      COMPROVANTE_SERVICE_URL: "${COMPROVANTE_SERVICE_URL:-http://comprovante-service:8000}"
      COMPROVANTE_CONNECT_TIMEOUT: "${COMPROVANTE_CONNECT_TIMEOUT:-3s}"
      COMPROVANTE_READ_TIMEOUT: "${COMPROVANTE_READ_TIMEOUT:-35s}"
      COMPROVANTE_PROCESSING_TTL: "${COMPROVANTE_PROCESSING_TTL:-PT2M}"
      COMPROVANTE_SUCCESS_TTL: "${COMPROVANTE_SUCCESS_TTL:-P1D}"
      COMPROVANTE_INTERNAL_TOKEN: "${COMPROVANTE_INTERNAL_TOKEN:-}"
      WEBSOCKET_ALLOWED_ORIGINS: "${WEBSOCKET_ALLOWED_ORIGINS:?WEBSOCKET_ALLOWED_ORIGINS obrigatorio}"
      PASSWORD_RECOVERY_WINDOW: "${PASSWORD_RECOVERY_WINDOW:-PT15M}"
      PASSWORD_RECOVERY_REQUEST_LIMIT: "${PASSWORD_RECOVERY_REQUEST_LIMIT:-5}"
      PASSWORD_RECOVERY_VALIDATE_LIMIT: "${PASSWORD_RECOVERY_VALIDATE_LIMIT:-5}"
      PASSWORD_RECOVERY_RESET_LIMIT: "${PASSWORD_RECOVERY_RESET_LIMIT:-5}"
      PASSWORD_RECOVERY_CODE_TTL: "${PASSWORD_RECOVERY_CODE_TTL:-PT15M}"
      PASSWORD_RECOVERY_TOKEN_TTL: "${PASSWORD_RECOVERY_TOKEN_TTL:-PT15M}"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}"
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  comprovante-service:
    image: "${COMPROVANTE_IMAGE}"
    container_name: comprovante-service
    pull_policy: always
    init: true
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      N8N_COMPROVANTE_WEBHOOK_URL: "${N8N_COMPROVANTE_WEBHOOK_URL}"
      N8N_COMPROVANTE_TIMEOUT_SECONDS: "${N8N_COMPROVANTE_TIMEOUT_SECONDS:-30}"
      COMPROVANTE_LOGO_PATH: "${COMPROVANTE_LOGO_PATH:-/app/logo.png}"
      COMPROVANTE_INTERNAL_TOKEN: "${COMPROVANTE_INTERNAL_TOKEN:?COMPROVANTE_INTERNAL_TOKEN obrigatorio}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      LOG_LEVEL: "${COMPROVANTE_LOG_LEVEL:-INFO}"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:1.27-alpine
    container_name: app247-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      # Relativo à pasta do compose: no servidor, <pasta>/nginx/ (enviado pelo workflow).
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    # Sem portas publicadas enquanto o TLS estiver no ngrok. Com domínio próprio:
    # "80:80" e "443:443" + certificado (ver 24por7_contexto/nginx.md).
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/nginx-health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    depends_on:
      - nginx
    # Domínio estático da conta ngrok: sem ele a URL muda a cada reinício e quebram o webhook
    # do MP, o MP_OAUTH_REDIRECT_URL e os apps.
    command:
      - "http"
      - "--url=${NGROK_URL:-tayna-fitful-mariko.ngrok-free.dev}"
      - "nginx:80"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # Painel mostra todo o tráfego (senhas, tokens): só localhost, acesso via túnel SSH.
    ports:
      - "127.0.0.1:4040:4040"
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--appendfsync", "everysec" ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql_data_v2:
  redis_data:
