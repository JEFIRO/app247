# Incluído em cada location: em nginx, um location que define proxy_set_header
# deixa de herdar os do server, então os cabeçalhos ficam todos aqui.
# X-Forwarded-For é SOBRESCRITO com o IP real: o valor enviado pelo cliente nunca chega ao app.
proxy_pass http://app247_backend;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $proxy_scheme;
proxy_set_header X-Forwarded-Host  $host;
# O Spring Security já envia estes cabeçalhos; o nginx os acrescenta também para as respostas
# que ele mesmo gera (429/413). Esconde os do app para não saírem duplicados.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
