# Proxy reverso do App 24/7. Hoje fica atrás do ngrok (TLS no ngrok):
#   internet --HTTPS--> ngrok --HTTP--> nginx:80 --> app:8080
# Quando houver domínio próprio, acrescente o server 443 (ver 24por7_contexto/nginx.md).
# Incluído no bloco http{} do nginx.conf padrão da imagem.

# --- IP real do cliente ---------------------------------------------------------
# O ngrok acrescenta o IP real ao final do X-Forwarded-For. Confiando só na rede
# interna do Docker, real_ip_recursive pega o último IP não confiável (o cliente),
# ignorando o que o cliente tenha forjado no início do header.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Rate limit (camada extra; o backend tem limites próprios por CPF/e-mail) ---
limit_req_zone $binary_remote_addr zone=auth_publico:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_geral:10m rate=30r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conexoes:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# O ngrok informa https; sem ele (acesso interno), usa o esquema da conexão.
map $http_x_forwarded_proto $proxy_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream app247_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Maior upload: planilha de importação (10 MB) + partes JSON. Igual ao multipart do Spring.
    client_max_body_size 11m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    limit_conn conexoes 50;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Health do próprio nginx (não passa pelo app).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Rotas públicas de autenticação/cadastro: limite apertado por IP.
    location ~ ^/(auth/(login|login/admin|register|send-code|validate-code)|onboarding|condominio|user/(recuperar|validar|redefinir-senha))$ {
        limit_req zone=auth_publico burst=10 nodelay;
        include /etc/nginx/snippets/proxy-app247.conf;
        proxy_set_header Connection "";
    }

    # WebSockets do Terminal e de pagamento.
    location ~ ^/(terminal-socket|payment-socket/|ws(/|$)) {
        include /etc/nginx/snippets/proxy-app247.conf;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Webhook do Mercado Pago: sem rate limit (rajadas legítimas), autenticado por HMAC no app.
    location = /webhook/mercadopago {
        include /etc/nginx/snippets/proxy-app247.conf;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=api_geral burst=60 nodelay;
        include /etc/nginx/snippets/proxy-app247.conf;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
