spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
app247.workers.enabled=false
api.secret.token=test-only-jwt-secret-with-at-least-32-characters
app247.identity.hash-secret=test-only-identity-hash-secret-with-at-least-32-characters
app.websocket.allowed-origins=http://localhost
spring.mp.id=test-client-id
spring.mp.id.secret=test-client-secret
spring.mp.redirect_url.oauth=http://localhost/test/oauth/callback
# Todos os testes compartilham a origem 127.0.0.1; os limites reais são cobertos em PublicAuthRateLimitIntegrationTest.
app.security.login.max-failures-per-cpf=100000
app.security.login.max-attempts-per-origin=100000
app.security.email-code.send-per-email=100000
app.security.email-code.send-per-origin=100000
app.security.email-code.validate-per-email=100000
app.security.onboarding.per-origin=100000
mercado-pago.token-refresh.enabled=false
