spring.application.name=app247
# O maior upload é a planilha de importação (product-import.max-file-bytes = 10 MB); imagens
# têm limite próprio de 5 MB em app.storage.image.max-size. Request = arquivo + partes JSON.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.storage.image.max-size=${IMAGE_MAX_SIZE:5MB}

# OCI Object Storage (API compatível com S3). Sem estas variáveis a aplicação sobe,
# mas uploads de imagem respondem 503 STORAGE_NOT_CONFIGURED.
oci.s3.namespace=${OCI_NAMESPACE:}
oci.s3.region=${OCI_REGION:}
oci.s3.bucket=${OCI_BUCKET:}
oci.s3.access-key=${OCI_ACCESS_KEY:}
oci.s3.secret-key=${OCI_SECRET_KEY:}
server.port=${PORT:8080}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
http.client.connect-timeout=${HTTP_CONNECT_TIMEOUT:5s}
http.client.read-timeout=${HTTP_READ_TIMEOUT:15s}

app.comprovante.base-url=${COMPROVANTE_SERVICE_URL:http://localhost:8000}
app.comprovante.endpoint=${COMPROVANTE_SERVICE_ENDPOINT:/comprovante}
app.comprovante.connect-timeout=${COMPROVANTE_CONNECT_TIMEOUT:3s}
app.comprovante.read-timeout=${COMPROVANTE_READ_TIMEOUT:35s}
app.comprovante.idempotency.processing-ttl=${COMPROVANTE_PROCESSING_TTL:PT2M}
app.comprovante.idempotency.success-ttl=${COMPROVANTE_SUCCESS_TTL:P1D}
app.comprovante.internal-token=${COMPROVANTE_INTERNAL_TOKEN:}
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
app.security.password-recovery.window=${PASSWORD_RECOVERY_WINDOW:PT15M}
app.security.password-recovery.request-limit=${PASSWORD_RECOVERY_REQUEST_LIMIT:5}
app.security.password-recovery.validate-limit=${PASSWORD_RECOVERY_VALIDATE_LIMIT:5}
app.security.password-recovery.reset-limit=${PASSWORD_RECOVERY_RESET_LIMIT:5}
app.security.password-recovery.code-ttl=${PASSWORD_RECOVERY_CODE_TTL:PT15M}
app.security.password-recovery.token-ttl=${PASSWORD_RECOVERY_TOKEN_TTL:PT15M}
app.security.login.window=${LOGIN_RATE_WINDOW:PT15M}
app.security.login.max-failures-per-cpf=${LOGIN_MAX_FAILURES_PER_CPF:5}
app.security.login.max-attempts-per-origin=${LOGIN_MAX_ATTEMPTS_PER_ORIGIN:50}
app.security.email-code.window=${EMAIL_CODE_RATE_WINDOW:PT15M}
app.security.email-code.send-per-email=${EMAIL_CODE_SEND_PER_EMAIL:3}
app.security.email-code.send-per-origin=${EMAIL_CODE_SEND_PER_ORIGIN:20}
app.security.email-code.validate-per-email=${EMAIL_CODE_VALIDATE_PER_EMAIL:5}
app.security.onboarding.window=${ONBOARDING_RATE_WINDOW:PT1H}
app.security.onboarding.per-origin=${ONBOARDING_PER_ORIGIN:5}
app.terminal.pairing.ttl=${TERMINAL_PAIRING_TTL:PT15M}
app.security.terminal-pairing.window=${TERMINAL_PAIRING_RATE_WINDOW:PT1H}
app.security.terminal-pairing.start-per-origin=${TERMINAL_PAIRING_START_PER_ORIGIN:30}
app.security.terminal-pairing.approval-failures-per-company=${TERMINAL_PAIRING_APPROVAL_FAILURES:10}

app.test-endpoints.enabled=${TEST_ENDPOINTS_ENABLED:false}
mercado-pago.point.expiration-time=${MP_POINT_EXPIRATION_TIME:PT5M}
mercado-pago.api-base-url=${MP_API_BASE_URL:https://api.mercadopago.com}
payment.reconciliation.fixed-delay-ms=${PAYMENT_RECONCILIATION_DELAY_MS:15000}
payment.reconciliation.initial-delay-ms=${PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:15000}
payment.reconciliation.window-hours=${PAYMENT_RECONCILIATION_WINDOW_HOURS:4}
payment.reconciliation.batch-size=${PAYMENT_RECONCILIATION_BATCH_SIZE:100}
payment.reconciliation.submission-retry-cooldown-ms=${PAYMENT_SUBMISSION_RETRY_COOLDOWN_MS:5000}
mercado-pago.token-refresh.enabled=${MP_TOKEN_REFRESH_ENABLED:true}
mercado-pago.token-refresh.before-expiry=${MP_TOKEN_REFRESH_BEFORE_EXPIRY:P30D}
mercado-pago.token-refresh.fixed-delay-ms=${MP_TOKEN_REFRESH_DELAY_MS:21600000}
api.secret.token=${JWT}
app247.identity.hash-secret=${IDENTITY_HASH_SECRET}
app247.tenant-link.invitation-ttl=${TENANT_LINK_INVITATION_TTL:PT72H}
app247.terms-url=${APP247_TERMS_URL:}
app247.privacy-url=${APP247_PRIVACY_URL:}
app247.terms-version=${APP247_TERMS_VERSION:}
app247.privacy-version=${APP247_PRIVACY_VERSION:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.prefer_native_enum_types=false
spring.jackson.time-zone=UTC

api.mercado.pago.webhook.secret=${MP_WEBHOOK_SECRET:}
api.mercado.pago.test.access.token=${MP_TEST_ACCESS_TOKEN:}
api.mercado.pago.test.terminal-id=${MP_TEST_TERMINAL_ID:NEWLAND_N950__SBX0000001}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}

spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mp.id=${MP_CLIENT_ID:}
spring.mp.id.secret=${MP_CLIENT_SECRET:}
server.forward-headers-strategy=framework
spring.mp.redirect_url.oauth=${MP_OAUTH_REDIRECT_URL:}

#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Importação controlada de produtos
product-import.max-file-bytes=${PRODUCT_IMPORT_MAX_FILE_BYTES:10485760}
product-import.max-rows=${PRODUCT_IMPORT_MAX_ROWS:10000}
product-import.recovery-delay-ms=${PRODUCT_IMPORT_RECOVERY_DELAY_MS:60000}
product-import.recovery-initial-delay-ms=${PRODUCT_IMPORT_RECOVERY_INITIAL_DELAY_MS:60000}
spring.data.redis.repositories.enabled=false
app.customer-link.ttl-seconds=${CUSTOMER_LINK_TTL_SECONDS:120}
app.customer-link.rate-limit-per-minute=${CUSTOMER_LINK_RATE_LIMIT_PER_MINUTE:30}
