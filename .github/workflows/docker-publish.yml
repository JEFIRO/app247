name: Build and Deploy App247

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O runner possui Docker; os testes Testcontainers (MySQL 8.4) executam aqui.
      - name: Testes
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e enviar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            jefiroo/app247-backend:latest
            jefiroo/app247-backend:${{ github.sha }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Verificar chave SSH
        run: |
          echo "Fingerprint da chave usada pelo GitHub:"
          ssh-keygen -y -f ~/.ssh/oracle_key | ssh-keygen -lf -

      # deploy/docker-compose.yml é a fonte única do compose de produção. Vai para a pasta do
      # servidor junto com deploy/nginx/ (montado pelo serviço nginx como ./nginx/...).
      # O .env de produção já está no servidor e não é enviado.
      - name: Enviar compose e configuração do nginx
        run: |
          REMOTE="${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}"
          ssh -i ~/.ssh/oracle_key "$REMOTE" \
            'set -e; mkdir -p ~/projetos/back-app247; cd ~/projetos/back-app247;
             if [ -f docker-compose.yml ]; then cp docker-compose.yml docker-compose.yml.bak; fi;
             rm -rf nginx.new'
          scp -i ~/.ssh/oracle_key deploy/docker-compose.yml \
            "$REMOTE":~/projetos/back-app247/docker-compose.yml.new
          scp -i ~/.ssh/oracle_key -r deploy/nginx \
            "$REMOTE":~/projetos/back-app247/nginx.new

      - name: Deploy na Oracle
        run: |
          ssh -i ~/.ssh/oracle_key \
          ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'EOF'
            set -e
            cd ~/projetos/back-app247

            # Só troca os arquivos depois de validar o compose novo com o .env do servidor.
            docker compose -f docker-compose.yml.new config -q
            mv docker-compose.yml.new docker-compose.yml
            rm -rf nginx.old
            if [ -d nginx ]; then mv nginx nginx.old; fi
            mv nginx.new nginx

            docker compose pull app
            docker compose up -d --no-deps app

            # Valida a config do nginx antes de recriá-lo; se falhar, volta a anterior.
            if ! docker compose run --rm --no-deps -T nginx nginx -t; then
              echo "Configuração do nginx inválida; restaurando a anterior"
              rm -rf nginx && mv nginx.old nginx
              exit 1
            fi
            # Bind mount fixa o diretório da criação do container: recria para ler a pasta nova.
            docker compose up -d --no-deps --force-recreate nginx
            docker compose up -d --no-deps ngrok

            docker image prune -f
            docker compose ps
          EOF
