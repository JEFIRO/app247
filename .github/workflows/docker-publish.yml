name: Build and Deploy App247

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O runner possui Docker; os testes Testcontainers (MySQL 8.4) executam aqui.
      - name: Testes
        run: ./mvnw --batch-mode --no-transfer-progress test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: DOCKERHUB_USERNAME

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e enviar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            jefiroo/app247-backend:latest
            jefiroo/app247-backend:${{ github.sha }}

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Verificar chave SSH
        run: |
          echo "Fingerprint da chave usada pelo GitHub:"
          ssh-keygen -y -f ~/.ssh/oracle_key | ssh-keygen -lf -

      - name: Deploy na Oracle
        run: |
          ssh -i ~/.ssh/oracle_key \
          ${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }} << 'EOF'

            cd ~/app247

            docker compose pull app
            docker compose up -d --no-deps app

            docker image prune -f
            docker compose ps

          EOF